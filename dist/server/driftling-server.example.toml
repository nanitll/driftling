# Конфиг driftling-server. Оба поля необязательны (показаны дефолты).

# Адрес прослушивания. Сервер говорит плоским HTTP — наружу его выставляет
# reverse-proxy с TLS (Caddy/nginx), поэтому дефолт — только localhost.
# В Docker слушаем 0.0.0.0 (порт наружу мапит compose).
listen = "127.0.0.1:8787"

# База SQLite (WAL). Относительный путь считается от каталога этого файла.
db = "driftling-server.sqlite3"

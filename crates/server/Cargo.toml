[package]
name = "driftling-server"
description = "Sync server for Driftling: journal push/pull + presence lease (self-host, TZ §3.5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "driftling-server"
path = "src/main.rs"

# ВАЖНО: server — единственный крейт workspace, которому разрешён tokio
# (отдельный бинарь, с демоном/настройками не линкуется). zbus/ksni при
# этом НЕ должны получить фичу tokio — server от них не зависит, но после
# любых правок зависимостей проверяем:
#   cargo tree -e features -i zbus | grep -c tokio  == 0
# (унификация фич уже ломала a11y в eframe — см. комментарии в корневом
# Cargo.toml у ksni/zbus).
[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# SQLite: rusqlite + bundled (статическая линковка libsqlite3 — один бинарь
# без системных зависимостей, как у atuin/vaultwarden). Сервер прост —
# соединение под Mutex, корректность важнее пропускной способности.
rusqlite = { version = "0.37", features = ["bundled"] }
# Токены аккаунтов: в БД только sha256-хэш; сам токен печатается один раз.
sha2 = "0.10"
# Криптослучайность для генерации токенов (fastrand НЕ подходит — не CSPRNG).
getrandom = "0.3"

[dev-dependencies]
# Handler-тесты без сети: tower::ServiceExt::oneshot по Router.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

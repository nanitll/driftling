[package]
name = "driftling"
description = "Driftling — a desktop tamagotchi that walks on your screen and drifts between your devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
driftling-core = { workspace = true }
driftling-platform = { workspace = true }
driftling-ipc = { workspace = true }
driftling-worldsense = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
systemd-journal-logger = { workspace = true }
signal-hook = { workspace = true }
ksni = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
# Синк (фаза E): sync-state.json воркера и JSON-тела HTTP API v1.
serde = { workspace = true }
serde_json = { workspace = true }
# Крошечный БЛОКИРУЮЩИЙ HTTP-клиент для синк-воркера (ТЗ §3.5). В демоне
# tokio запрещён (фичи zbus/ksni! см. workspace Cargo.toml); дефолтные
# фичи minreq = ноль зависимостей и только plain http — TLS терминирует
# reverse-proxy на стороне сервера, клиент ходит по LAN/VPN/localhost.
minreq = "3"
# Проверка прав каталога папочного синка в ctl doctor (access W_OK).
rustix = { workspace = true }

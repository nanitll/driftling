# Манифест встроенного пака «default».
# Формат описан в crates/core/src/pack.rs (модульный doc-комментарий);
# он же — будущий манифест внешних .driftpack.
format = 1

[stages.egg]
native = 24

[stages.egg.anims.egg]
fps = 1.5
frames = ["egg_0", "egg_1"]

[stages.egg.anims.hatch]
fps = 2.0
frames = ["hatch_0", "hatch_1", "hatch_2"]

[stages.baby]
native = 24

[stages.baby.anims.idle]
fps = 2.0
frames = ["idle_0", "idle_1"]

[stages.baby.anims.walk]
fps = 6.0
frames = ["walk_0", "walk_1", "walk_2", "walk_3"]

[stages.baby.anims.sleep]
fps = 1.0
frames = ["sleep_0", "sleep_1"]

[stages.baby.anims.falling]
fps = 8.0
frames = ["falling_0"]

[stages.baby.anims.dragged]
fps = 4.0
frames = ["dragged_0"]

[stages.baby.anims.landing]
fps = 6.0
frames = ["landing_0"]

[stages.baby.anims.eating]
fps = 4.0
frames = ["eating_0", "eating_1"]

[stages.baby.anims.happy]
fps = 3.0
frames = ["happy_0", "happy_1"]

[stages.baby.anims.sad]
fps = 1.5
frames = ["sad_0"]

[stages.baby.anims.sick]
fps = 1.5
frames = ["sick_0"]


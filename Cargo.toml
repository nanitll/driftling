[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ipc",
    "crates/driftling",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftling/driftling"

[workspace.dependencies]
driftling-core = { path = "crates/core" }
driftling-platform = { path = "crates/platform" }
driftling-ipc = { path = "crates/ipc" }

smithay-client-toolkit = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ipc",
    "crates/driftling",
    "crates/settings",
    "crates/worldsense",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanitll/driftling"
# MSRV крейтов демона диктует wayland-protocols; проверяется CI-джобой
# msrv (ТД-27). driftling-settings из гарантии исключён: eframe/egui
# требуют свежий rustc и поднимают планку каждым релизом.
rust-version = "1.86"

[workspace.dependencies]
driftling-core = { path = "crates/core" }
driftling-platform = { path = "crates/platform" }
driftling-ipc = { path = "crates/ipc" }
driftling-worldsense = { path = "crates/worldsense" }

smithay-client-toolkit = "0.19"
# X11-бэкенд и worldsense-провайдер (D3): чистый Rust, без libxcb
# (RustConnection); фичи-расширения добавляются в крейтах. Лицензия
# MIT OR Apache-2.0 — в allow-списке deny.toml.
x11rb = "0.13"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Логи в journald под systemd (ТД-19).
systemd-journal-logger = "2"
# Флаги SIGTERM/SIGINT без unsafe (ТД-20).
signal-hook = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
# Иконка в системном трее (B7): чистый Rust SNI, KDE нативно; блокирующий
# API — трей живёт в своём потоке без async-обвязки в нашем коде.
# ВАЖНО: default-features=false гасит дефолтный ksni/tokio — иначе фичи
# workspace-сборки унифицируют zbus в tokio-режим, и accesskit (a11y в
# eframe у настроек) паникует «no reactor running» без tokio-рантайма.
# async-io — рантайм для zbus, общий с accesskit.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# D-Bus для worldsense (фаза D): приём снапшотов от KWin-скрипта. Тот же
# режим, что у ksni: блокирующий API поверх async-io, фичу tokio НЕ включать
# никогда — сломает a11y в eframe (см. предупреждение у ksni выше).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# i18n (ТД-30): Fluent-локализация, локаль из ОС, en — полный фолбэк.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[profile.release]
lto = true
strip = true
